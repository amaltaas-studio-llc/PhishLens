# Publishes a release when a v* tag is pushed, with the packaged extension attached.
#
#   npm version patch    # or minor / major — writes package.json and creates the tag
#   git push --follow-tags
#
# The tag is required to agree with package.json, because the manifest version is generated from it and
# a release whose asset reports a different version than its tag is worse than no release. When the version
# has already been written by an earlier commit, tag that commit directly rather than bumping again.
#
# The notes are the commit subjects since the previous tag, so a subject that would read as nonsense to
# someone deciding whether to update is a problem to fix in the commit message, not here.
#
# Two jobs, because `npm ci` runs the install scripts of every dev dependency. The job that runs them can
# only read the repository and keeps no token on disk; the job that can write a release runs no project
# code at all, only `gh` against the files the first job produced. Merging them back into one job would
# hand a compromised dev dependency the power to publish a release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      # Full history and tags: the release notes are derived from the commits since the previous tag,
      # which a shallow clone cannot see.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      # A published asset cannot be quietly replaced the way an artifact can, so it is checked before the
      # zip exists rather than after someone reports that Chrome refused it.
      - name: Check the build is loadable
        run: npm run check:dist

      # Zipped from inside dist/ so manifest.json sits at the archive root, which is what both "Load
      # unpacked" and the Web Store dashboard expect.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p release
          cd dist
          zip -qr "../release/phishlens-${{ steps.meta.outputs.version }}.zip" .
          cd ..
          unzip -l "release/phishlens-${{ steps.meta.outputs.version }}.zip"

      # Commit subjects only. They lead with an imperative summary of why the change was needed, which is
      # already the sentence a reader of the release wants; the bodies are for someone reading the history,
      # not someone deciding whether to update.
      - name: Write release notes
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo '### What changed'
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..${GITHUB_REF_NAME}"
              echo
              echo "[Full diff](${{ github.server_url }}/${{ github.repository }}/compare/$previous...${GITHUB_REF_NAME})"
            else
              echo '- First release.'
            fi
            echo
          } > release/notes.md
          cat >> release/notes.md <<'NOTES'
          ### Install

          PhishLens is not on the Chrome Web Store. To install this build:

          1. Download `phishlens-${{ steps.meta.outputs.version }}.zip` below and unzip it.
          2. Open `chrome://extensions` and turn on **Developer mode**.
          3. Choose **Load unpacked** and select the unzipped folder.
          4. Open a message in Gmail. The risk score appears beside the sender's address.

          Analysis runs entirely in your browser and no API key is required. AI analysis is off by default;
          the deterministic checks produce a full score without it. You can turn it on in the options to use
          Chrome's on-device model, where your Chrome provides one, or a model server you run yourself.

          PhishLens is advisory. It does not block links, downloads or replies.
          NOTES
          cat release/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      # No checkout: `--repo` names the repository, and the tag already exists because pushing it is what
      # started this run.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/phishlens-${VERSION}.zip" \
            --repo "${{ github.repository }}" \
            --title "PhishLens $GITHUB_REF_NAME" \
            --notes-file release/notes.md
