# Publishes a release when a v* tag is pushed, with the packaged extension attached: a zip for Chromium
# browsers and a Mozilla-signed .xpi for Firefox.
#
#   npm version patch    # or minor / major; writes package.json and creates the tag
#   git push --follow-tags
#
# The tag is required to agree with package.json, because the manifest version is generated from it and
# a release whose asset reports a different version than its tag is worse than no release. When the version
# has already been written by an earlier commit, tag that commit directly rather than bumping again.
#
# The notes are the commit subjects since the previous tag, so a subject that would read as nonsense to
# someone deciding whether to update is a problem to fix in the commit message, not here.
#
# Three jobs, because `npm ci` runs the install scripts of every dev dependency. The build job runs them,
# can only read the repository, and holds no secret. The sign job is the only one given the
# addons.mozilla.org key: it installs with scripts disabled and runs nothing but `web-ext` on the Firefox zip
# the build job tested. The publish job holds the only write token and runs nothing but `gh`. Merging any
# two would hand a compromised dev dependency either the power to publish a release or the key to sign as
# ShoutPhish.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      # Full history and tags: the release notes are derived from the commits since the previous tag,
      # which a shallow clone cannot see.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build && npm run build:firefox

      # A published asset cannot be quietly replaced the way an artifact can, so it is checked before the
      # zip exists rather than after someone reports that a browser refused it.
      - name: Check the build is loadable
        run: npm run check:dist

      - name: Lint the Firefox build
        run: npm run lint:firefox

      # Zipped from inside each build directory so manifest.json sits at the archive root, which is what
      # "Load unpacked", Firefox's "Load Temporary Add-on", and both stores' upload forms expect. One
      # Chromium package serves every Chromium browser on every operating system and processor: an
      # extension is JavaScript and HTML, with nothing compiled per platform.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p release
          version='${{ steps.meta.outputs.version }}'
          (cd dist && zip -qr "../release/shoutphish-${version}.zip" .)
          (cd dist-firefox && zip -qr "../release/shoutphish-firefox-${version}.zip" .)
          unzip -l "release/shoutphish-${version}.zip"
          unzip -l "release/shoutphish-firefox-${version}.zip"

      # Mozilla requires the readable source of any minified submission, so its reviewers can rebuild the
      # package and compare. The tagged tree is exactly what produced the zips above.
      - name: Archive the source for Mozilla's review
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          git archive --format=zip --prefix="shoutphish-${version}/" \
            -o "release/shoutphish-source-${version}.zip" "$GITHUB_REF_NAME"

      # Commit subjects only. They lead with an imperative summary of why the change was needed, which is
      # already the sentence a reader of the release wants; the bodies are for someone reading the history,
      # not someone deciding whether to update.
      - name: Write release notes
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo '### What changed'
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..${GITHUB_REF_NAME}"
              echo
              echo "[Full diff](${{ github.server_url }}/${{ github.repository }}/compare/$previous...${GITHUB_REF_NAME})"
            else
              echo '- First release.'
            fi
            echo
          } > release/notes.md
          cat >> release/notes.md <<'NOTES'
          ### Install

          ShoutPhish is not listed on the Chrome Web Store, Edge Add-ons or addons.mozilla.org yet.

          **Chrome or Edge**

          1. Download `shoutphish-${{ steps.meta.outputs.version }}.zip` below and unzip it.
          2. Open `chrome://extensions` (or `edge://extensions` in Edge) and turn on **Developer mode**.
          3. Choose **Load unpacked** and select the unzipped folder.
          4. Open a message in Gmail. The risk score appears beside the sender's address.

          **Firefox 140 or later**

          1. Download `shoutphish-firefox-${{ steps.meta.outputs.version }}.xpi` below.
          2. Open `about:addons`, click the gear icon, and choose **Install Add-on From File**.
          3. Select the downloaded file, choose **Add**, then open a message in Gmail.

          The file is signed by Mozilla, so it stays installed when Firefox restarts.

          Analysis runs entirely in your browser and no API key is required. AI analysis is off by default;
          the deterministic checks produce a full score without it. You can turn it on in the options to use
          the browser's on-device model, where it provides one (Chrome does, on devices that qualify), or a
          model server you run yourself.

          ShoutPhish is advisory. It does not block links, downloads or replies.
          NOTES
          cat release/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Unlisted: Mozilla signs the package for distribution from these releases without listing it on
  # addons.mozilla.org. A version number can be submitted once, so a failure after the upload is accepted
  # cannot be fixed by re-running this job; release the next patch version instead.
  sign:
    name: Sign for Firefox
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Checked out only for the lockfile, so `web-ext` is the reviewed version with verified integrity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      # The key arrives as environment variables, which web-ext reads as its --api-key and --api-secret,
      # so it never appears in a command line that the process list or a log could show.
      - name: Sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir firefox signed
          unzip -q "release/shoutphish-firefox-${VERSION}.zip" -d firefox
          ./node_modules/.bin/web-ext sign \
            --channel=unlisted \
            --source-dir=firefox \
            --artifacts-dir=signed \
            --upload-source-code="release/shoutphish-source-${VERSION}.zip" \
            --approval-timeout=1800000
          shopt -s nullglob
          signed=(signed/*.xpi)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "::error::expected one signed .xpi from web-ext, found ${#signed[@]}"
            exit 1
          fi
          mv "${signed[0]}" "signed/shoutphish-firefox-${VERSION}.xpi"
          unzip -l "signed/shoutphish-firefox-${VERSION}.xpi"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed
          path: signed/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: signed

      # No checkout: `--repo` names the repository, and the tag already exists because pushing it is what
      # started this run. The unsigned Firefox zip is not attached: release Firefox would keep it only
      # until a restart, and a second Firefox download would invite picking the wrong one.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/shoutphish-${VERSION}.zip" \
            "signed/shoutphish-firefox-${VERSION}.xpi" \
            --repo "${{ github.repository }}" \
            --title "ShoutPhish $GITHUB_REF_NAME" \
            --notes-file release/notes.md
